constraints:
  preferred_contribution: New empirical finding about human-AI conversation
  publication_priority: full_paper
  research_breadth: Continue multiple research questions while preserving failed promotion gates; assess a bounded methods-paper contribution before another metric search.
  extended_abstract_condition: User will consider an extended abstract only alongside a separate full-paper submission; not a standalone fallback.
  prior_next_goal_status: Abstract-only route superseded; specificity and grounded-dependency development waves executed and assessed. Methods-paper feasibility is proposed but not activated; no confirmation activated.
  participant_recruitment: false
  preferred_resources: [existing_compute, public_data, reusable_local_results]
  private_conversation_text: local_only
  repository_policy: Preserve independent Git histories and existing edits.
  completed_pilot_decisions: Preserve narrow negative and inconclusive findings; do not generalize them to all dynamics or memory questions.

tracks:
  - id: iscs-2027
    priority: primary
    basis: user_confirmed
    confirmed: "2026-10-18"
    status: grounded_dependency_pilot_narrow_no_full_paper_promotion
    objective: Investigate several empirical questions, then select a defensible coherent contribution for the conference.
    venue:
      name: International Symposium on Complex Systems 2027
      location: Porto, Portugal
      start: "2027-06-02"
      end: "2027-06-04"
      submission_deadline: "2027-03-01"
      checked: "2026-10-18"
      call_url: https://iutdijon.u-bourgogne.fr/ccs-france/
      submissions_url: https://iutdijon.u-bourgogne.fr/ccs-france/submissions/
      abstract_eligibility: published_or_unpublished_research_2_to_4_pages_latex
      publication_and_reuse_terms: live_2027_page_advertises_springer_ssdc_and_selected_applied_network_science_invitations_detailed_extension_and_companion_rules_unresolved
    discussion_order: [observation-boundary-methods, grounded-conversational-dependencies, integration-versus-switching, anonymization-distortion, development-and-application]
    fallback_directions: [long-gap-reuse, anonymization-distortion]
    next_action: The CGDIALOG training pilot supplies usable human relevance labels but fails joint incremental recovery/state gates. Do not scale it or prepare PRISM validation packets. Assess a bounded methods-paper feasibility goal with one independent application and novelty gate; see papers/grounded-dependencies/NEXT-GOAL.md. Preserve positive findings, all 248 reserve components and the broader relational question (reserve opened 2026-10-18; no further confirmation use). Abstract remains a conditional separate companion.

  - id: semantic-embedding-dynamics
    priority: secondary
    basis: user_confirmed_interest
    confirmed: "2026-10-17"
    status: history_specificity_controls_complete_consolidation_remains_planned
    objective: Investigate complementary draft questions and consolidate the strongest supported findings into a coherent manuscript.
    directions: [dynamics-and-state-representation]
    next_action: Retain history-pooling gains, information-boundary and packaging controls, and revision-template counterexamples. Fixed geometric bundles did not improve controlled later-use detection over token sequence; natural revision persistence was unestimable. Do not infer intrinsic role-memory ordering, recent-context sufficiency or validated semantic physics. A distinctive independently useful outcome remains necessary.

directions:
  - id: grounded-conversational-dependencies
    status: development_executed_joint_measurement_gates_failed
    recommendation: narrow_substantive_question_stop_current_automatic_scaling
    track: iscs-2027
    source_work_ids: [embedding-dynamics, semantic-dynamics]
    evidence: papers/grounded-dependencies/REPORT.md
    question: Can nonlocal fact or constraint relevance be distinguished from recency and topic continuity, and separately from necessity?
    outcome: Original CGDIALOG human relevance annotations; not intervention-identified necessity or human-AI transfer.
    sample: 564 public training records in 68 history-linkage components; 559 fully mapped and 300 nonlocal-positive records in 66 components.
    next_gate: Independently judged fact-specific human-AI relations and baseline-resistant recovery; no reserve use or validation packet is activated.
    evidence_limit: MiniLM ESConv increment is positive but imprecise; joint two-source/two-encoder and state criteria fail. Positive low-overlap MSC MiniLM contrast remains secondary. Response-visible diagnostics and authored controls cannot establish causal necessity.

  - id: observation-boundary-methods
    status: proposed_feasibility_not_activated
    recommendation: assess_one_independent_application_before_paper_promotion
    track: iscs-2027
    source_work_ids: [temporal-networks, embedding-dynamics, semantic-dynamics]
    evidence: papers/grounded-dependencies/audits/literature.md
    next_goal: papers/grounded-dependencies/NEXT-GOAL.md
    question: Does a precise observation or information-boundary error change a substantive conclusion, and can a useful remedy survive an independent application?
    evidence_limit: Existing corrections and elementary counterexamples do not themselves warrant a full methods paper. CIG 2026 is an external audit candidate, not a demonstrated failure; no new source data acquired.

  - id: history-specificity
    status: development_executed_effect_gates_failed
    recommendation: stop_current_ranking_route_narrow_to_grounded_dependencies
    track: iscs-2027
    source_work_ids: [embedding-dynamics, semantic-dynamics]
    prior_experiments: [P05, P06, P08, P10]
    proposed_questions: [HS01, HS02, HS03, HS04]
    question: What do earlier turns predict about the next user contribution beyond topic, recent context and stable participant/style cues?
    outline: docs/research/HISTORY-SPECIFICITY-LEAD.md
    evidence: papers/history-specificity/REPORT.md
    next_gate: Suitable independently annotated dependency outcomes, adequate nonlocal coverage, baseline-resistant recovery and credible human-AI validation before confirmation.
    evidence_limit: Positive cosine persists, but selected long fails stronger short-context ranking baselines in both encoders. Exact-topic donor control exceeds rejection gate; stable-topic/style generators can satisfy performance criteria. No mechanism or full-paper finding established.

  - id: substantive-revision-and-reuse
    status: event_centered_assessment_complete_current_source_no_go
    recommendation: stop_scaling_current_source_preserve_optional_blind_audit
    track: iscs-2027
    source_work_ids: [embedding-dynamics, semantic-dynamics]
    experiments: [P04]
    question: Which natural challenges change an expressed commitment under the same premises, and is the changed commitment used when an observable later opportunity exists?
    outcome: Independently evidenced commitment change and opportunity-conditioned later use
    evidence: papers/integration-measurement/events/REPORT.md
    prior_evidence: papers/integration-measurement/pilot/REPORT.md
    next_gate: Independent judgments would need to identify currently missed revisions and opportunities beyond recorded ambiguity, clear the frozen floors, and support a distinct empirical contrast. No confirmation or reserve activation is authorized.
    evidence_limit: One hundred windows in the same 36 exposed components yield zero clear same-premise revisions; favorable recorded ambiguity gives three events in two components and two possible linked opportunities. Twenty blind packets are prepared; zero human labels. Prior first-exchange and synthetic negative evidence remains unchanged.

  - id: role-conditioned-history
    status: development_effect_survives_distinct_contribution_unestablished
    recommendation: narrow_preserve_reserve
    track: iscs-2027
    source_work_ids: [embedding-dynamics, semantic-dynamics]
    experiments: [P05, P06]
    question: Does uniform available history improve next user-turn embedding forecasts over the last two messages after information and representation controls?
    outcome: Fixed raw-cosine gain for user targets in both pinned encoders; role interaction and centered cosine are secondary.
    evidence: papers/history-falsification/REPORT.md
    next_gate: Define an independently meaningful outcome or consequential correction beyond established context benefits, then freeze a new development design with strong content controls before considering reserve use.
    evidence_limit: Primary gain survives all four views and role mixtures in both encoders. Role ordering fails common-prefix comparison; weak compressed readouts do not establish recent-context sufficiency. Same exposed PRISM cohort; no independent confirmation.

  - id: integration-versus-switching
    status: six_ai_calibration_drafts_prepared_construct_unvalidated
    recommendation: defer_until_distinct_construct_question_and_independent_coding
    track: iscs-2027
    source_work_ids: [knowledge-networks, hierarchical-memory, semantic-dynamics]
    question: When do multi-topic conversations integrate concepts rather than switch tasks or list subjects?
    outcome: Independently annotated relational/application evidence within an exchange
    data_leads: [PRISM, fresh_WildChat_partition]
    calibration: papers/integration-measurement/CALIBRATION-NOTES.md
    next_gate: Reliable labels, adequate case coverage and a precise contribution beyond existing bridge taxonomy and discourse analysis

  - id: development-and-application
    status: coauthor_access_audited_terms_and_linkage_gated
    recommendation: conditional_alternative
    track: iscs-2027
    source_work_ids: [embedding-dynamics, semantic-dynamics, operational-memex]
    question: Which observable conversational developments precede independently observed application?
    outcome: Independent problem-solving success or traced incorporation/transformation; select one
    data_leads: [KITE, CoAuthor]
    next_gate: Verify linkage, release/license and outcome suitability; distinguish from existing reuse and transfer findings
    access_note: CoAuthor official v1.0 acquired; 1445 metadata sessions join, 2 logs are orphaned, 61 writer proxies differ from 63 advertised, and explicit official data terms remain unlocated. Zero session bodies or replays opened. KITE's usable linked export remains unverified.
    access_audit: papers/history-falsification/audits/coauthor-feasibility.md

  - id: long-gap-reuse
    status: candidate
    recommendation: conditional
    track: iscs-2027
    source_work_ids: [temporal-networks, temporal-calibration, hierarchical-memory]
    question: Does a return repeat an old task or transform an old relation for a new problem?
    outcome: Independently coded repeat, revision or application after a directly measured return lag
    next_gate: Sufficient new held-out histories and defensible archive linkage
    evidence_limit: The eleven previously selected archives are development evidence, not fresh confirmation.

  - id: anonymization-distortion
    status: candidate
    recommendation: methodological_fallback
    track: iscs-2027
    source_work_ids: [conversation-corpus, knowledge-networks, hierarchical-memory]
    question: Do privacy transformations materially change network-based scientific conclusions?
    outcome: Changes in validated relations, bridge rankings, communities or inference under controlled transformations
    next_gate: Consequential distortion and mitigation beyond generic privacy/utility tradeoffs

  - id: useful-abstraction
    status: candidate
    recommendation: longer_term
    source_work_ids: [hierarchical-memory, selective-forgetting]
    question: Which abstraction levels preserve useful relations and rare exceptions?
    outcome: Independently validated retrieval or application performance
    next_gate: Validate the information construct before comparing retention or hierarchy methods.

  - id: dynamics-and-state-representation
    status: first_wave_narrow_negative_and_measurement_findings
    recommendation: retain_one_planned_lineage_no_broad_physics_claim
    track: semantic-embedding-dynamics
    source_work_ids: [embedding-dynamics, semantic-dynamics]
    question: What conversation-state representation supports reliable reconstruction, development measurement or prediction?
    outcome: Public next-embedding, common-prefix and observation controls executed; history pooling survives, role ordering changes, and external development labels remain unavailable.
    next_gate: Establish independently useful prediction beyond strong content/sequence baselines; prefix agreement and construction identities do not suffice.

